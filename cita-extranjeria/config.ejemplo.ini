; Copia este archivo como config.ini y rellénalo. config.ini NO se sube a git.

[datos]
; Tal como aparece en el desplegable de la web (basta con un trozo)
provincia = Barcelona
; Un trozo único del nombre del trámite. Para ver los nombres exactos:
;   python vigilante.py --listar-tramites
tramite = TOMA DE HUELLAS
; NIE, PASAPORTE o DNI
tipo_documento = NIE
documento = X1234567A
nombre_completo = NOMBRE APELLIDO1 APELLIDO2
; Solo se usan si la web los pide para tu trámite
anio_nacimiento =
pais_nacionalidad =
caducidad_tarjeta =

[email]
; Con Gmail necesitas una "contraseña de aplicación" (no tu contraseña normal):
; https://myaccount.google.com/apppasswords  (requiere verificación en 2 pasos)
remitente = tucorreo@gmail.com
contrasena_app = xxxx xxxx xxxx xxxx
destinatario = tucorreo@gmail.com
smtp_host = smtp.gmail.com
smtp_puerto = 465

[vigilancia]
; Espera aleatoria entre comprobaciones (minutos). No bajes de 3.
minutos_min = 3
minutos_max = 6
; Solo vigila en este horario (las citas suelen liberarse de día)
hora_inicio = 7
hora_fin = 23
